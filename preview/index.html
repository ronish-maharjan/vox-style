<!doctype html>
<meta charset="utf-8">
<title>Vox Studio preview</title>
<style>
  body { margin: 0; background: #222; color: #eee; font: 14px system-ui; display: flex; flex-direction: column; height: 100vh; }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { box-shadow: 0 0 30px #000; }
  #bar { padding: 10px 14px; display: flex; gap: 12px; align-items: center; background: #111; }
  #t { flex: 1; }
  .warn { color: #ffb84a; } .err { color: #ff6a55; font-weight: 600; }
</style>
<link rel="stylesheet" href="/preview/fonts.css">
<div id="stage"><canvas id="c"></canvas></div>
<div id="bar">
  <button id="play">▶</button><input id="t" type="range" min="0" max="1" step="0.0333" value="0">
  <span id="clock"></span>
  <select id="aspect"><option>9:16</option><option>16:9</option></select>
  <label><input type="checkbox" id="safe"> safe area</label>
  <span id="info"></span>
</div>
<script type="importmap">
{ "imports": {
  "vox-studio/core/": "/core/",
  "vox-studio/kit/": "/props/_shared/"
} }
</script>
<script type="module" src="./preview.js"></script>
